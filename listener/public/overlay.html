<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jalur Numerology - Overlay Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --violet-1:#7c3aed; --violet-2:#4c1d95;
    --gold-1:#f5b942; --gold-2:#b5651d;
    --pink-1:#fb7185; --pink-2:#9d174d;
    --glow: rgba(124,58,237,.55);
  }
  html, body { margin:0; padding:0; background: transparent; overflow:hidden; width:100%; height:100%; }
  * { box-sizing:border-box; font-family:'Inter', 'Segoe UI', Arial, sans-serif; }

  #brand{
    position:fixed; top: clamp(10px, 3vh, 22px); left:50%; transform:translateX(-50%);
    display:flex; align-items:center; gap: clamp(6px, 1vw, 9px);
    padding: clamp(6px, 1.2vh, 9px) clamp(14px, 3vw, 20px); border-radius:999px;
    background: linear-gradient(135deg, rgba(30,20,60,.55), rgba(20,12,40,.65));
    backdrop-filter: blur(12px) saturate(140%);
    -webkit-backdrop-filter: blur(12px) saturate(140%);
    border: 1px solid rgba(255,255,255,.16);
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    white-space:nowrap;
  }
  #brand .dot{
    width: clamp(7px, 1vw, 9px); height: clamp(7px, 1vw, 9px); border-radius:50%; flex:none;
    background: linear-gradient(160deg, var(--gold-1), var(--violet-1));
    box-shadow: 0 0 8px var(--gold-1);
  }
  #brand .brandText{
    font-family:'Sora', sans-serif; font-weight:700; font-size: clamp(12px, 2.4vw, 15px); letter-spacing:.02em;
    background: linear-gradient(120deg, #fff, #d9c8ff 60%, var(--gold-1));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }

  #stage {
    position:fixed; left:50%; bottom: clamp(28px, 8vh, 64px); transform:translateX(-50%);
    width: min(520px, 94vw);
  }

  #card {
    position:relative; padding: clamp(14px, 3vw, 22px) clamp(16px, 4vw, 28px); border-radius:22px; overflow:hidden;
    background: linear-gradient(135deg, rgba(30,20,60,.55), rgba(20,12,40,.65));
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border: 1px solid rgba(255,255,255,.14);
    box-shadow: 0 20px 60px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.03) inset;
    opacity:0; transform: scale(.85) translateY(24px);
    transition: opacity .45s cubic-bezier(.2,1.4,.4,1), transform .45s cubic-bezier(.2,1.4,.4,1);
  }
  #card.show { opacity:1; transform: scale(1) translateY(0); }
  #card.hide { opacity:0; transform: scale(.92) translateY(-10px); transition: opacity .3s ease, transform .3s ease; }

  #card::before{
    content:''; position:absolute; inset:-2px; border-radius:24px; padding:2px;
    background: linear-gradient(120deg, var(--glow), transparent 40%, var(--glow));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    opacity:.9; pointer-events:none;
  }
  #card.gift::before{ background: linear-gradient(120deg, rgba(245,185,66,.8), transparent 40%, rgba(245,185,66,.8)); }
  #card.like::before{ background: linear-gradient(120deg, rgba(251,113,133,.8), transparent 40%, rgba(251,113,133,.8)); }

  .row{ display:flex; align-items:center; gap: clamp(10px, 3vw, 18px); position:relative; z-index:1; }

  .numWrap{
    position:relative; width: clamp(58px, 16vw, 86px); height: clamp(58px, 16vw, 86px); border-radius: clamp(14px, 4vw, 20px); flex:none;
    display:flex; align-items:center; justify-content:center;
    background: linear-gradient(160deg, var(--violet-1), var(--violet-2));
    box-shadow: 0 8px 22px rgba(124,58,237,.45);
  }
  #card.gift .numWrap{ background: linear-gradient(160deg, var(--gold-1), var(--gold-2)); box-shadow: 0 8px 22px rgba(245,185,66,.45); }
  #card.like .numWrap{ background: linear-gradient(160deg, var(--pink-1), var(--pink-2)); box-shadow: 0 8px 22px rgba(251,113,133,.45); }
  .numWrap .num{
    font-family:'Sora', sans-serif; font-weight:800; font-size: clamp(24px, 7vw, 38px); color:#fff;
    text-shadow: 0 2px 10px rgba(0,0,0,.35);
  }
  .numWrap .ring{
    position:absolute; inset:-6px; border-radius: clamp(18px, 5vw, 24px); border:2px solid rgba(255,255,255,.35);
    animation: pulse 2.2s ease-out infinite;
  }
  @keyframes pulse{ 0%{ transform:scale(.9); opacity:.8;} 100%{ transform:scale(1.25); opacity:0;} }

  .info{ min-width:0; flex:1; }
  .info .nick{
    font-family:'Sora', sans-serif; font-weight:700; font-size: clamp(14px, 3.6vw, 19px); color:#fff;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .info .sub{ font-size: clamp(11px, 2.6vw, 13px); color:rgba(255,255,255,.68); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .info .label{
    font-size: clamp(10px, 2.2vw, 11.5px); font-weight:600; letter-spacing:.04em; text-transform:uppercase;
    margin-top: clamp(6px, 1.6vh, 9px); display:inline-flex; align-items:center; gap:6px;
    padding: clamp(3px, 1vh, 4px) clamp(8px, 2vw, 10px); border-radius:999px; color:#fff;
    background: rgba(124,58,237,.35); border:1px solid rgba(255,255,255,.18);
    max-width:100%;
  }
  .info .label span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #card.gift .label{ background: rgba(245,185,66,.28); }
  #card.like .label{ background: rgba(251,113,133,.3); }
  .label svg{ width: clamp(10px, 2.4vw, 12px); height: clamp(10px, 2.4vw, 12px); flex:none; }

  /* sparkle buat gift & like */
  .spark{
    position:absolute; border-radius:50%; background:#fff; pointer-events:none; opacity:0;
  }
  #card.gift .spark, #card.like .spark{ animation: spark 1.1s ease-out forwards; }
  @keyframes spark{
    0%{ opacity:0; transform:translate(0,0) scale(0);}
    15%{ opacity:1; }
    100%{ opacity:0; transform: translate(var(--dx), var(--dy)) scale(1); }
  }

  /* Kanvas sangat sempit/potret (mis. overlay dipasang di live vertikal) */
  @media (max-width: 420px){
    #stage{ width: min(400px, 96vw); }
    .row{ gap:10px; }
  }

  #status{ position:fixed; top:10px; left:10px; font-size:11px; color:#fff; opacity:.45; font-family:monospace; }
</style>
</head>
<body>
  <div id="status">connecting...</div>

  <div id="brand">
    <span class="dot"></span>
    <span class="brandText">Jalur Numerology</span>
  </div>

  <div id="stage">
    <div id="card">
      <div class="row">
        <div class="numWrap">
          <div class="ring"></div>
          <div class="num" id="num">-</div>
        </div>
        <div class="info">
          <div class="nick" id="nick">-</div>
          <div class="sub">Angka Hidup dari <span id="dob">-</span></div>
          <div class="label" id="badge"></div>
        </div>
      </div>
    </div>
  </div>

<script>
(function(){
  const statusEl = document.getElementById('status');
  const card = document.getElementById('card');
  const numEl = document.getElementById('num');
  const nickEl = document.getElementById('nick');
  const dobEl = document.getElementById('dob');
  const badgeEl = document.getElementById('badge');

  const ICON_COMMENT = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16v12H7l-3 3V4z"/></svg>';
  const ICON_GIFT = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 7h-2.2c.1-.3.2-.6.2-1a2.5 2.5 0 0 0-4.5-1.5L12 6l-1.5-1.5A2.5 2.5 0 0 0 6 6c0 .4.1.7.2 1H4a1 1 0 0 0-1 1v3a1 1 0 0 0 1 1v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1zM8.5 5a.5.5 0 0 1 .5-.5c.4 0 1 .5 1.5 1L9.5 6.5A1 1 0 0 1 8.5 5.5V5zm6 0v.5a1 1 0 0 1-1 1L12.5 5.5c.5-.5 1.1-1 1.5-1a.5.5 0 0 1 .5.5zM6 10h5v9H6v-9zm7 9v-9h5v9h-5z"/></svg>';
  const ICON_LIKE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-10-9C.4 8.7 2 5 5.6 5c2 0 3.4 1.1 4.4 2.4C11 6.1 12.4 5 14.4 5 18 5 19.6 8.7 22 12c-2.5 4.4-10 9-10 9z"/></svg>';

  // Antrian: kalau beberapa event masuk beruntun, tampil bergantian, tidak saling timpa
  const queue = [];
  let showing = false;

  function spawnSparkles(){
    for (let i=0;i<10;i++){
      const s = document.createElement('div');
      s.className = 'spark';
      const size = 3 + Math.random()*4;
      s.style.width = s.style.height = size + 'px';
      s.style.left = 40 + Math.random()*40 + '%';
      s.style.top = 20 + Math.random()*40 + '%';
      s.style.setProperty('--dx', (Math.random()*160-80) + 'px');
      s.style.setProperty('--dy', (Math.random()*-120-20) + 'px');
      card.appendChild(s);
      setTimeout(()=>s.remove(), 1200);
    }
  }

  function renderItem(data){
    card.classList.remove('gift', 'like');
    if (data.source === 'gift') card.classList.add('gift');
    else if (data.source === 'like') card.classList.add('like');

    numEl.textContent = data.lifePath;
    nickEl.textContent = data.nickname;
    nickEl.title = data.nickname;
    dobEl.textContent = data.dob;

    if (data.source === 'gift') {
      badgeEl.innerHTML = ICON_GIFT + '<span>Kirim ' + (data.giftName || 'gift') + '</span>';
    } else if (data.source === 'like') {
      badgeEl.innerHTML = ICON_LIKE + '<span>' + (data.likeMilestone || '') + ' like!</span>';
    } else {
      badgeEl.innerHTML = ICON_COMMENT + '<span>Komen live</span>';
    }

    card.classList.remove('hide');
    requestAnimationFrame(()=> card.classList.add('show'));
    if (data.source === 'gift' || data.source === 'like') spawnSparkles();
  }

  function processQueue(){
    if (showing || queue.length === 0) return;
    showing = true;
    const item = queue.shift();
    renderItem(item);
    setTimeout(() => {
      card.classList.remove('show');
      card.classList.add('hide');
      setTimeout(() => { showing = false; processQueue(); }, 320);
    }, 5200);
  }

  function connect(){
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(proto + '://' + location.host);

    ws.onopen = () => { statusEl.textContent = 'connected'; };
    ws.onclose = () => { statusEl.textContent = 'disconnected, retrying...'; setTimeout(connect, 3000); };
    ws.onerror = () => ws.close();

    ws.onmessage = (ev) => {
      let data;
      try { data = JSON.parse(ev.data); } catch (e) { return; }
      if (data.type !== 'result') return;
      queue.push(data);
      processQueue();
    };
  }

  connect();
})();
</script>
</body>
</html>
