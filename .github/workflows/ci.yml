name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check all JS files
        run: |
          for f in app.js calculator.js interpretations.js; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Run unit tests
        run: node --test tests/

  listener:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: listener
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax check listener JS files
        run: |
          for f in server.js calculator.js; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Run listener tests (toggle, konektor TikTok palsu, tanpa jaringan)
        run: npm test
